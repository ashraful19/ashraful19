name: Generate contribution snake

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only-action@v3
        with:
          github_user_name: ashraful19
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=purple&color_dots=#161b22,#7c3aed,#8b5cf6,#a78bfa,#c4b5fd
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
